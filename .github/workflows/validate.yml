name: Validate opt-in data pack
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: epic-terrain-mc1.21.1
          path: dist/*
  server-fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compat/neoforge-1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: epc-worldgen-fix-neoforge-1.21.1
          path: compat/neoforge-1.21.1/build/libs/*.jar
