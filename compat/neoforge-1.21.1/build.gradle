plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.140' }
version='1.0.1-d9.2'
java { toolchain.languageVersion=JavaLanguageVersion.of(21) }
neoForge { version='21.1.248'; mods { d9_epc_worldgen_fix { sourceSet sourceSets.main } } }
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }
sourceSets.test { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath }
